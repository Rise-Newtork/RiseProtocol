syntax = "proto3";
package life;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

option java_package = "com.risehytale.api";
option java_multiple_files = true;

message RegisterContainerCreatorRequest {
  NodeMeta nodeMeta = 1;
  IpPort managementEndpoint = 2; //the endpoint the grpc inbound on the hytale server created will be

  repeated ServerAcceptedType acceptedTypes = 4;
  int32 maxContainers = 5;
}

message RegisterContainerCreatorAck {
  bool success = 1;
  string error = 2;
  string containerName = 3; //will be used so the mm knows if the container started properly
  google.protobuf.Duration heartbeatInterval = 4;
}

message DeregisterContainerCreatorRequest {
  NodeMeta nodeMeta = 1;
  string reason = 2;
}

message DeregisterContainerCreatorAck {
  bool success = 1;
  string error = 2;
}

message SetupContainerRequest {
  string requestId = 1;
  repeated ServerAcceptedType serverType = 2;
}

message SetupContainerAck {
  bool success = 1;
  string error = 2;
  IpPort managementEndpoint = 3; //the endpoint the grpc inbound on the hytale server created will be
  IpPort gameEndpoint = 4; //games port an ip
}

