syntax = "proto3";
package life;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

option java_package = "com.risehytale.api";
option java_multiple_files = true;

message RegisterContainerCreatorRequest {
  NodeMeta nodeMeta = 1;
  IpPort managementEndpoint = 2; //the endpoint the grpc inbound on the hytale server created will be

  repeated ServerAcceptedType acceptedTypes = 4;
  int32 maxContainers = 5;
  int32 memoryBudgetMb = 6; // total memory the node gives to game containers; 0 means uncapped
}

message RegisterContainerCreatorAck {
  bool success = 1;
  string error = 2;
  reserved 3; // containerName, which is per container and now lives on SetupContainerAck
  google.protobuf.Duration heartbeatInterval = 4;
}

message DeregisterContainerCreatorRequest {
  NodeMeta nodeMeta = 1;
  string reason = 2;
}

message DeregisterContainerCreatorAck {
  bool success = 1;
  string error = 2;
}

message SetupContainerRequest {
  string requestId = 1;
  repeated ServerAcceptedType serverType = 2;
  int32 memoryMb = 3; // the container's memory limit; 0 takes the node's default
}

// success means the Hytale server inside has booted, not just that the container started.
// The call can take up to the creator's start timeout, so set a deadline above it; a
// cancelled call has its container destroyed.
message SetupContainerAck {
  bool success = 1;
  string error = 2;
  IpPort managementEndpoint = 3; //the endpoint the grpc inbound on the hytale server created will be
  IpPort gameEndpoint = 4; //games port an ip
  string containerName = 5; // the container's identity from here on: the matchmaker matches the
                            // server's sign-in against it, and it is what the creator labels
                            // and logs. Set by the creator; the Docker id is an implementation detail.
}

// Everything the Rise mod inside a container needs to know about itself. The creator
// serialises it to JSON into the container's environment as RISE_SERVER_META; the image's
// entrypoint writes that string to servermeta.json for the mod to read with the generated
// JSON parser, so both ends share this one definition.
message ContainerMeta {
  string containerName = 1;
  string requestId = 2;
  NodeMeta nodeMeta = 3;
  repeated ServerAcceptedType serverTypes = 4;
  IpPort gameEndpoint = 5;         // what players connect to: the node's public host and port
  IpPort managementEndpoint = 6;   // what the control plane reaches the mod's gRPC on
  int32 gamePort = 7;              // what the server binds inside the container
  int32 managementPort = 8;        // what the mod binds inside the container
  IpPort controlPlaneEndpoint = 9; // where the mod signs in
}

message DestroyContainerRequest {
  string containerName = 1; // from SetupContainerAck
  string reason = 2;
}

message DestroyContainerAck {
  bool success = 1;
  string error = 2;
}
