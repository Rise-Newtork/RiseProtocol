syntax = "proto3";
package life;

option java_package = "com.risehytale.api";
option java_multiple_files = true;

enum ServerAcceptedType {
  SERVER_TYPE_UNSPECIFIED = 0;
  SERVER_TYPE_STICK_GAME = 1;
  SERVER_TYPE_DUEL_1V1 = 2;
  SERVER_TYPE_DUEL_2v2 = 3;
  SERVER_TYPE_TUTORIAL = 4;
  SERVER_TYPE_TRAINING = 5;
  SERVER_TYPE_HUB = 6;
  SERVER_TYPE_HUB_PVP = 7;
}

message ServerMeta {
  string serverId = 1;
  string nodeId = 2;
  double serverLatitude = 3;
  double serverLongitude = 4;
}

enum GameStatus {
  GAME_STATUS_UNSPECIFIED = 0;
  SERVER_LOADING = 1;
  WAITING_FOR_PLAYERS = 2;
  STARTING = 3;
  IN_PROGRESS = 4;
  ENDING = 5;
  ENDED = 6;
  SERVER_CLOSING = 7;
}