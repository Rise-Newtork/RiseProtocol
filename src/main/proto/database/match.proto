syntax = "proto3";
package life;

import "google/protobuf/timestamp.proto";
import "common/common.proto";

option java_package = "com.risehytale.api";
option java_multiple_files = true;

// GAME is a real match. WINDOW is one flush from an open arena such as KitPvP: the server
// aggregates for a few minutes, then reports the window as a match with one team per player.
enum MatchKind {
  MATCH_KIND_UNSPECIFIED = 0;
  MATCH_KIND_GAME = 1;
  MATCH_KIND_WINDOW = 2;
}

// Everything a server sends about one finished match or window. The matchmaker stamps the season.
// The id is minted by whoever started the match - the matchmaker for a lobby match, the server
// for one it opened itself - so a retried report is acknowledged as a duplicate and changes
// nothing.
message MatchReport {
  string matchId = 1;
  GameMode gameMode = 2;
  MatchKind kind = 3;
  optional string map = 4;
  string serverId = 5;
  google.protobuf.Timestamp startedAt = 6;
  google.protobuf.Timestamp endedAt = 7;
  repeated Team teams = 8;
  MatchSeries series = 9; // match-level facts of every best-of-N mode
}

// A solo player is a team of one. Placement is 1 for the winners and absent when the mode has
// no placements, such as a window.
message Team {
  int32 teamNo = 1;
  optional int32 placement = 2;
  repeated Participant participants = 3;
}

// Combat is shared by every fighting mode and rounds by every best-of-N mode, so a mode fills the
// blocks it has and leaves the rest out - a sumo duel fills rounds and counters both. Leave a
// block out and nothing is written for it.
message Participant {
  string playerUuid = 1;
  string name = 2;
  CombatStats combat = 3;
  RoundStats rounds = 4;
  BossStats boss = 5;
  repeated Counter counters = 6;
}

// One named number a mode produced, keyed "<mode>.<name>" in lower snake case: "stick.hold_ms",
// "sumo.pushes", "kitpvp.time_alive_ms". How a key aggregates into lifetime totals - sum, max,
// min - and whether it has a leaderboard is matchmaker configuration rather than the sender's
// choice, so two hosts cannot disagree about what a key means. An unknown key is stored and
// reported back, never silently dropped.
message Counter {
  string key = 1;
  int64 value = 2;
}

// Only the families with something to report need to be present.
message CombatStats {
  repeated WeaponStats weapons = 1;
}

message WeaponStats {
  WeaponFamily family = 1;
  int64 kills = 2;
  int64 deaths = 3;
  double damageDone = 4;
  double damageTaken = 5;
}

message MatchSeries {
  int32 bestOf = 1;
  optional string ladder = 2;
}

message RoundStats {
  int64 roundsWon = 1;
  int64 roundsLost = 2;
}

// One boss attempt. hpPctLeft is the player's health at the killing blow, so only a win has it.
message BossStats {
  bool won = 1;
  int64 damage = 2;
  int64 durationMs = 3;
  int32 damagePct = 4;
  optional int32 hpPctLeft = 5;
}

// A recorded match as stored.
message Match {
  string matchId = 1;
  GameMode gameMode = 2;
  MatchKind kind = 3;
  int32 seasonId = 4;
  optional string map = 5;
  optional string serverId = 6;
  google.protobuf.Timestamp startedAt = 7;
  google.protobuf.Timestamp endedAt = 8;
  google.protobuf.Timestamp recordedAt = 9;
}

// A match with everything recorded for it; participant names are the players' current names.
message MatchDetail {
  Match match = 1;
  repeated Team teams = 2;
  MatchSeries series = 3;
}

// Lives here rather than in database_service.proto so the game protos can report how a recording
// went without importing the whole database API.
enum RecordOutcome {
  RECORD_OUTCOME_UNSPECIFIED = 0;
  RECORD_OUTCOME_RECORDED = 1;
  RECORD_OUTCOME_DUPLICATE = 2; // this match id was already recorded; nothing changed
}
