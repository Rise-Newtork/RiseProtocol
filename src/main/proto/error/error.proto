syntax = "proto3";
package life;

import "google/protobuf/timestamp.proto";
import "common/common.proto";

option java_package = "com.risehytale.api";
option java_multiple_files = true;

// The numbers are wire identity, not severity order: INFO was added after the
// first four were already in production, so it takes the next free number
// rather than slotting in between UNSPECIFIED and WARN. Consumers that rank
// severities must map the value through a table; comparing the raw number
// would put INFO above FATAL.
enum ErrorSeverity {
  ERROR_SEVERITY_UNSPECIFIED = 0;
  ERROR_SEVERITY_WARN = 1;
  ERROR_SEVERITY_ERROR = 2;
  ERROR_SEVERITY_CRITICAL = 3;
  ERROR_SEVERITY_FATAL = 4;
  // Least severe. Routine, non-failure reports.
  ERROR_SEVERITY_INFO = 5;
}

message ErrorMessage {
  ServerMeta serverMeta = 1;
  string errorCode = 2;
  string error = 3;
  string stackTrace = 4;
  ErrorSeverity severity = 5;
  google.protobuf.Timestamp occurredAt = 8;

  ServerAcceptedType serverType = 9;
  HubServerType hubServerType = 10; // set by hub servers instead of serverType
}
