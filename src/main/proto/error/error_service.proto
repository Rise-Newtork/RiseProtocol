syntax = "proto3";
package life;

import "error/error.proto";

option java_package = "com.risehytale.api";
option java_multiple_files = true;

service ErrorService {
  rpc ReportError(ErrorMessage) returns (ErrorAck);
  rpc StreamErrors(stream ErrorMessage) returns (ErrorAck);
}

message ErrorAck {
  bool accepted = 1;
  string error = 2;
}
